name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          # Прикрепить только .exe и latest.yml, исключить исходный код
          files: |
            release/AnLaunch-Setup-*.exe
            release/latest.yml
          # Не прикреплять всё подряд
          fail_on_unmatched_files: true
          # Сделать релиз не draft, чтобы автообновление работало
          draft: false
          prerelease: false
          generate_release_notes: true
